name: Temporary transcription - Recording 29

on:
  push:
    branches:
      - tmp-transcribe-recording-29
  workflow_dispatch:

jobs:
  stage-medium-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download quantized English medium model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o ggml-medium.en-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en-q5_0.bin?download=true'
          split -b 280M ggml-medium.en-q5_0.bin medium.part.
          ls -lh medium.part.*

      - name: Upload model part one
        uses: actions/upload-artifact@v4
        with:
          name: whisper-medium-part-aa
          path: medium.part.aa
          compression-level: 0
          retention-days: 1

      - name: Upload model part two
        uses: actions/upload-artifact@v4
        with:
          name: whisper-medium-part-ab
          path: medium.part.ab
          compression-level: 0
          retention-days: 1
