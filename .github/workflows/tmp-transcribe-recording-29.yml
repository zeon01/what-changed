name: Temporary transcription - Recording 29

on:
  push:
    branches:
      - tmp-transcribe-recording-29
  workflow_dispatch:

jobs:
  stage-whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download whisper.cpp Linux binary
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o whisper-bin.tar.gz \
            https://github.com/ggml-org/whisper.cpp/releases/download/b4938/whisper-bin-ubuntu-x64.tar.gz
          mkdir -p whisper-bin
          tar -xzf whisper-bin.tar.gz -C whisper-bin
          find whisper-bin -maxdepth 3 -type f -print

      - name: Download quantized English small model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o ggml-small.en-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin?download=true'
          ls -lh ggml-small.en-q5_1.bin

      - name: Build portable bundle
        run: |
          set -euxo pipefail
          mkdir -p bundle/bin bundle/model
          CLI="$(find whisper-bin -type f -name 'whisper-cli' | head -n 1)"
          test -n "$CLI"
          cp "$CLI" bundle/bin/whisper-cli
          chmod +x bundle/bin/whisper-cli
          cp ggml-small.en-q5_1.bin bundle/model/
          ldd bundle/bin/whisper-cli || true
          du -sh bundle

      - name: Upload temporary Whisper bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-recording29-bundle
          path: bundle/
          compression-level: 0
          retention-days: 1
